name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Type checking
      run: bun run lint

    - name: Configure localhost OpenSSH integration target
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y openssh-server
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        if [ ! -f ~/.ssh/id_ed25519 ]; then
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
        fi
        touch ~/.ssh/authorized_keys
        cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
        sort -u ~/.ssh/authorized_keys -o ~/.ssh/authorized_keys
        chmod 600 ~/.ssh/authorized_keys
        sudo mkdir -p /run/sshd
        sudo service ssh restart
        ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null
        ssh -o BatchMode=yes -T localhost true

    - name: Unit tests
      if: runner.os != 'Windows'
      run: bun run test

    - name: SSH Remote and Background Tasks Windows tests
      if: runner.os == 'Windows'
      run: node --import tsx --test --test-isolation=process tests/background-tasks.test.ts tests/ssh-remote.test.ts

  packages:
    needs: validate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.14'

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Validate independent package tarballs
      run: bun run pack:check
